<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090D0B" />
  <title>Ritual</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="brand/ritual-mark.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Ritual" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="color-scheme" content="dark light" />
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('ritual.v1') || 'null');
        var th = (s && s.theme) || 'dark';
        if (th === 'system') { th = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
        document.documentElement.setAttribute('data-theme', th);
        document.querySelector('meta[name=theme-color]').setAttribute('content', th === 'light' ? '#F3F5F7' : '#0B0E13');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <!-- ============================ PRODUCT STYLES ============================ -->
  <style>
    /* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
       Put this @layer first; product CSS outside the layer always wins. */
    @layer od-layout {
      :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

      .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
      .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
      .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
      .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
      .od-fill    { flex: 1 1 0; min-width: 0; }
      .od-fixed   { flex: none; }
      .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

      .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
      :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
      .od-tile { display: grid; grid-template-rows: auto 1fr; }
      :where(.od-tile) > :where(*) { display: block; }

      .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
      .od-media-cover { object-fit: cover; }

      .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .od-clamp-2 { -webkit-line-clamp: 2; }
      .od-clamp-3 { -webkit-line-clamp: 3; }
      .od-lines-2 { min-height: calc(2 * 1.4em); }
      .od-nowrap  { white-space: nowrap; }
      .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

      .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
      .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

      .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
                 padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
      .od-rail::-webkit-scrollbar { display: none; }
      :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
      :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

      .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
      .od-touch  { min-width: 44px; min-height: 44px; }
    }
    /* /OD-LAYOUT-PRIMITIVES v1 */

    :root {
      --bg: #0B0E13;
      --surface: #141A23;
      --surface2: #1E2733;
      --line: #2A3542;
      --fg: #EEF2F7;
      --muted: #8C99AA;
      --accent: #3DDC97;
      --accent-ink: #04150E;
      --accent-soft: #123A2B;
      --amber: #FFB454;
      --amber-soft: #4A3413;
      --coral: #FF6B6B;
      --coral-soft: #3A1F1F;
      --sky: #5AA9FF;
      --sky-soft: #18324F;
      --teal: #2DD4BF;
      --font-d: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
      --font-b: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-m: 'JetBrains Mono', ui-monospace, Consolas, monospace;
      --phone-system-fg: #EEF2F7;
      --phone-screen-bg: #0B0E13;
      color-scheme: dark;
    }
    html[data-theme="light"] {
      --bg: #F3F5F7;
      --surface: #FFFFFF;
      --surface2: #E7ECF1;
      --line: #D2DAE2;
      --fg: #111820;
      --muted: #5B6875;
      --accent: #0E8A5F;
      --accent-ink: #FFFFFF;
      --accent-soft: #CDEEE0;
      --amber: #9A6414;
      --amber-soft: #F4E3C4;
      --coral: #C2362F;
      --coral-soft: #F6D9D6;
      --sky: #2563C9;
      --sky-soft: #D6E6FB;
      --teal: #0F8A7C;
      --phone-system-fg: #111820;
      --phone-screen-bg: #F3F5F7;
      color-scheme: light;
    }

    body { font-family: var(--font-b); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    :focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; border-radius: 10px; }
    .muted { color: var(--muted); }
    .small { font-size: 12.5px; }
    .mono { font-family: var(--font-m); font-variant-numeric: tabular-nums; }
    .eyebrow { font: 600 11px/1.2 var(--font-m); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }

    /* shell overrides: the app owns the screen; it scrolls inside .phone-content */
    .phone-content { display: flex; flex-direction: column; padding: 0; overflow: hidden; background: var(--bg); }
    #app { display: flex; flex-direction: column; width: 100%; height: 100%; background: var(--bg); color: var(--fg); }
    .app-main {
      flex: 1 1 auto; min-height: 0;
      overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none;
      padding: calc(var(--phone-safe-top) + 10px) 18px 26px;
    }
    .app-main::-webkit-scrollbar { display: none; }

    /* ---------- shared bits ---------- */
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .section-head h2 { font: 700 26px/1 var(--font-d); letter-spacing: -.01em; }
    .eyebrow-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 0 10px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
    .bar { height: 9px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s ease; }
    .bar.steel > span { background: var(--sky); }
    .empty { text-align: center; padding: 26px 14px; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; font-size: 13.5px; line-height: 1.5; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 13px; padding: 13px 18px; font: 700 15px/1 var(--font-b); min-height: 48px; }
    .btn.block { width: 100%; }
    .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
    .btn.subtle { background: var(--surface2); color: var(--fg); }
    .btn.danger { background: var(--coral); color: #fff; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn .ic { width: 18px; height: 18px; }

    .iconbtn { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--surface2); border: 0; color: var(--fg); }
    .iconbtn .ic { width: 24px; height: 24px; }
    .iconbtn.accent { background: var(--accent); color: var(--accent-ink); }
    .ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--surface2); border: 0; color: var(--muted); }
    .ico .ic { width: 18px; height: 18px; }
    .ico.danger { color: var(--coral); }

    .seg { display: inline-flex; background: var(--surface2); border-radius: 12px; padding: 3px; gap: 2px; }
    .seg button { background: none; border: 0; color: var(--muted); font: 600 13px/1 var(--font-b); padding: 9px 15px; border-radius: 9px; }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.25); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; color: var(--muted); font: 500 13.5px/1 var(--font-b); }
    .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    .input, select, textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 13px; color: var(--fg); font: 400 15px/1.4 var(--font-b);
    }
    textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
    .input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field > label { font: 600 12.5px/1 var(--font-b); color: var(--muted); }

    /* ---------- today ---------- */
    .greet { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .h-date { font: 700 23px/1.15 var(--font-d); margin-top: 5px; }
    .streakpill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px; flex: none; }
    .streakpill .ic { width: 16px; height: 16px; color: var(--amber); }
    .streakpill b { font: 700 17px/1 var(--font-d); font-variant-numeric: tabular-nums; }
    .streakpill span { font-size: 10.5px; color: var(--muted); }

    .herocard { display: grid; gap: 20px; justify-items: center; }
    .ringwrap { position: relative; width: 176px; height: 176px; }
    .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 13; stroke-linecap: round; }
    .ring-bg { stroke: var(--surface2); }
    .ring-fg { stroke: var(--accent); transition: stroke-dashoffset .55s ease; }
    .ringmid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 3px; }
    .ringmid b { font: 700 40px/1 var(--font-d); font-variant-numeric: tabular-nums; }
    .ringmid span { font: 500 12px/1.3 var(--font-b); color: var(--muted); }

    .statstrip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; width: 100%; }
    .stat { background: var(--surface2); border-radius: 14px; padding: 12px 8px; text-align: center; display: grid; gap: 4px; }
    .stat b { font: 700 22px/1 var(--font-d); font-variant-numeric: tabular-nums; }
    .stat span { font: 500 10.5px/1.2 var(--font-b); color: var(--muted); letter-spacing: .02em; }

    .levelrow { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 7px; }
    .lvlname { font: 600 13.5px/1 var(--font-b); }

    .banner { display: flex; gap: 10px; align-items: center; border-radius: 14px; padding: 13px 15px; font-size: 13.5px; font-weight: 500; margin-top: 14px; }
    .banner .ic { width: 20px; height: 20px; }
    .banner.good { background: var(--accent-soft); }
    .banner.good .ic, .banner.good b { color: var(--accent); }
    .banner.rest { background: var(--sky-soft); }
    .banner.rest .ic { color: var(--sky); }

    .grouphead { font: 600 11px/1 var(--font-m); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 20px 0 9px; }
    .list { display: grid; gap: 8px; }
    .hrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 13px 14px; min-height: 62px; color: var(--fg); transition: border-color .18s, transform .12s; }
    .hrow:active { transform: scale(.985); }
    .check { flex: none; width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--muted); display: grid; place-items: center; color: var(--accent-ink); transition: background .16s, border-color .16s; }
    .hrow.done .check { background: var(--accent); border-color: var(--accent); }
    .hrow.done .check .ic { width: 18px; height: 18px; }
    .hmain { flex: 1 1 0; min-width: 0; display: grid; gap: 4px; }
    .htitle { font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
    .hrow.done .htitle { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .hsub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
    .hstreak { flex: none; display: inline-flex; align-items: center; gap: 3px; font: 600 12px/1 var(--font-m); color: var(--muted); }
    .hstreak.hot { color: var(--amber); }
    .hstreak .ic { width: 14px; height: 14px; }

    /* ---------- stats ---------- */
    .callouts { display: grid; gap: 10px; margin-top: 14px; }
    .callout { display: flex; gap: 11px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 13px 14px; }
    .callout .ic { width: 20px; height: 20px; margin-top: 1px; }
    .callout.good .ic { color: var(--accent); }
    .callout.warn .ic { color: var(--amber); }
    .callout.bad .ic { color: var(--coral); }
    .callout .ctxt { display: grid; gap: 3px; }
    .callout b { font-size: 14px; font-weight: 600; }
    .callout span { font-size: 12.5px; color: var(--muted); line-height: 1.45; }

    .arow { display: grid; gap: 8px; padding: 13px 0; border-top: 1px solid var(--line); }
    .arow:first-child { border-top: 0; }
    .arow-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .aname { font-weight: 600; font-size: 14.5px; min-width: 0; overflow-wrap: anywhere; }
    .apct { font: 700 15px/1 var(--font-m); font-variant-numeric: tabular-nums; }
    .abar { height: 7px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
    .abar > span { display: block; height: 100%; background: var(--accent); }
    .asub { font-size: 11.5px; color: var(--muted); }

    .bars { display: flex; align-items: flex-end; gap: 5px; height: 104px; margin-top: 4px; }
    .bcol { flex: 1 1 0; display: grid; grid-template-rows: 1fr auto; gap: 6px; height: 100%; min-width: 0; }
    .btrack { display: flex; align-items: flex-end; background: var(--surface2); border-radius: 6px; overflow: hidden; }
    .btrack span { display: block; width: 100%; background: var(--accent); border-radius: 6px; transition: height .5s ease; }
    .blab { font: 500 9.5px/1 var(--font-m); color: var(--muted); text-align: center; }

    .heatgrid { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 4px; }
    .hcell { width: 100%; aspect-ratio: 1; border-radius: 4px; background: var(--surface2); border: 1px solid transparent; }
    .hcell.well { background: var(--accent); }
    .hcell.part { background: var(--amber-soft); }
    .hcell.rest { background: var(--sky-soft); }
    .hcell.miss { background: transparent; border: 1px dashed var(--line); }
    .hcell.future { background: transparent; }
    .hcell.today { outline: 2px solid var(--fg); outline-offset: 1px; }
    .legend { display: flex; flex-wrap: wrap; gap: 7px 14px; margin-top: 14px; font-size: 11.5px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
    .legend .l-well i { background: var(--accent); }
    .legend .l-part i { background: var(--amber-soft); }
    .legend .l-rest i { background: var(--sky-soft); }
    .legend .l-miss i { border: 1px dashed var(--line); }

    /* ---------- habits ---------- */
    .hcard { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; }
    .hdrag { flex: none; width: 6px; height: 38px; border-radius: 99px; }
    .hinfo { flex: 1 1 0; min-width: 0; display: grid; gap: 4px; }
    .hmeta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .hbtns { display: flex; gap: 6px; flex: none; }
    .hbtns .ico { width: 36px; height: 36px; }

    .dayrow { display: flex; gap: 6px; }
    .daybtn { flex: 1 1 0; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 0; color: var(--muted); font: 600 12px/1 var(--font-b); }
    .daybtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

    /* ---------- journal ---------- */
    .prompt { font: 600 18px/1.35 var(--font-d); text-wrap: balance; margin: 4px 0 14px; }
    .entries { margin-top: 26px; }
    .entry { padding: 16px 0; border-top: 1px solid var(--line); }
    .entry:first-child { border-top: 0; }
    .entry .ehead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }
    .entry p { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.6; }

    /* ---------- you ---------- */
    .levelcard { display: grid; gap: 10px; }
    .levelname { font: 700 clamp(38px, 11vw, 52px)/.95 var(--font-d); letter-spacing: -.01em; }
    .achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px; margin-top: 12px; }
    .ach { padding: 12px 13px; border-radius: 13px; border: 1px solid var(--line); display: grid; gap: 3px; }
    .ach.on { background: var(--surface); border-color: var(--accent); }
    .ach.on b { color: var(--accent); }
    .ach.off { opacity: .55; }
    .ach b { font-weight: 600; font-size: 13.5px; }
    .ach span { font-size: 12px; color: var(--muted); }
    .block { margin-top: 26px; }
    .block > h3 { font: 700 19px/1.2 var(--font-d); margin-bottom: 12px; }
    .rows { display: grid; gap: 10px; }
    .about { font-size: 13px; line-height: 1.6; color: var(--muted); }

    /* ---------- onboarding ---------- */
    .onboard { display: grid; gap: 24px; padding-top: 6px; }
    .brandbig { display: grid; gap: 8px; }
    .brandbig h1 { font: 700 42px/1 var(--font-d); letter-spacing: -.02em; }
    .logo { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); margin-bottom: 4px; }
    .logo .ic { width: 28px; height: 28px; }
    .lede { color: var(--muted); font-size: 15px; line-height: 1.55; max-width: 34ch; }
    .stack { display: grid; gap: 8px; }
    .lvlcard { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; color: var(--fg); }
    .lvlcard.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .lvlcard b { font-weight: 600; }
    .lvlcard span { color: var(--muted); font-size: 13px; }

    /* ---------- overlays ---------- */
    .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; transition: opacity .2s; z-index: 40; }
    .scrim.open { opacity: 1; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 41;
      background: var(--surface); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line);
      padding: 12px 18px calc(var(--phone-safe-bottom) + 16px);
      max-height: 86%; overflow-y: auto; overscroll-behavior: contain;
      transform: translateY(112%); transition: transform .28s cubic-bezier(.2,.85,.25,1);
    }
    .sheet.open { transform: translateY(0); }
    .sheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line); margin: 0 auto 16px; }
    .sheet h3 { font: 700 21px/1.2 var(--font-d); margin-bottom: 4px; }
    .sheet .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
    .sheet-actions .btn { flex: 1 1 0; }

    .toast {
      position: absolute; left: 50%; bottom: calc(var(--phone-safe-bottom) + 78px);
      transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
      background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 12px;
      font: 600 13.5px/1.3 var(--font-b); max-width: 86%; text-align: center;
      transition: opacity .2s, transform .2s; z-index: 50;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- tab bar ---------- */
    .tabbar {
      flex: none; display: grid; grid-template-columns: repeat(5, 1fr);
      background: var(--surface); border-top: 1px solid var(--line);
      padding: 8px 6px calc(var(--phone-safe-bottom) - 6px);
    }
    .tabbar[hidden] { display: none; }

        '<div class="field"><label for="h-slot">Time of day</label><select id="h-slot">' + slotOpts + '</select></div>' +
        '<div class="field"><label for="h-diff">Effort</label><select id="h-diff">' + diffOpts + '</select></div>' +
        '<div class="field"><label>Days</label><div class="dayrow">' + dayBtns + '</div><button type="button" class="chip" data-act="sday-all" style="margin-top:10px;align-self:start">Every day</button></div>' +
        '<div class="sheet-actions"><button class="btn ghost" data-act="sheet-close">Cancel</button><button class="btn" data-act="save-habit">' + (h ? 'Save' : 'Add habit') + '</button></div>'
      );
    }

    function exportSheet(data) {
      openSheet(
        '<div class="grab"></div><h3>Backup</h3>' +
        '<p class="sub">Your habits, history and journal as JSON. Keep it somewhere safe.</p>' +
        '<textarea id="exp-text" readonly aria-label="Backup JSON" style="min-height:160px;font-family:var(--font-m);font-size:12px">' + esc(data) + '</textarea>' +
        '<div class="sheet-actions"><button class="btn ghost" data-act="copy-backup">Copy</button><button class="btn" data-act="sheet-close">Done</button></div>'
      );
    }

    function importSheet() {
      openSheet(
        '<div class="grab"></div><h3>Restore</h3>' +
        '<p class="sub">Paste a Ritual backup to replace everything on this device.</p>' +
        '<textarea id="imp-text" aria-label="Paste backup" placeholder="Paste your backup JSON here" style="min-height:140px;font-family:var(--font-m);font-size:12px"></textarea>' +
        '<div class="sheet-actions"><button class="btn ghost" data-act="sheet-close">Cancel</button><button class="btn" data-act="import-yes">Restore</button></div>'
      );
    }

    function resetSheet() {
      openSheet(
        '<div class="grab"></div><h3>Start over?</h3>' +
        '<p class="sub">This erases your habits, history, streaks and journal on this device. It cannot be undone.</p>' +
        '<div class="sheet-actions"><button class="btn ghost" data-act="sheet-close">Cancel</button><button class="btn danger" data-act="reset-yes">Erase everything</button></div>'
      );
    }

    /* ============================== views ============================== */
    function taskSummary(h) { return (AREAS[h.area] || 'Custom') + ' · ' + (SLOTS[h.slot] || 'Anytime'); }
    function schedLabel(h) {
      if (!h.days || h.days.length >= 7) return 'Every day';
      if (!h.days.length) return 'No days';
      return h.days.slice().sort().map(function (d) { return DAYS[d]; }).join(' ');
    }
    function hrow(h, isDone) {
      var st = habitStreak(h);
      var color = AREA_COLOR[h.area] || 'var(--accent)';
      return '<button class="hrow' + (isDone ? ' done' : '') + '" data-act="toggle" data-id="' + h.id + '" aria-pressed="' + (isDone ? 'true' : 'false') + '">' +
        '<span class="check">' + (isDone ? icon('check') : '') + '</span>' +
        '<span class="hmain"><span class="htitle">' + esc(h.title) + '</span>' +
        '<span class="hsub"><i class="dot" style="background:' + color + '"></i>' + esc(taskSummary(h)) + ' · ' + (h.xp || 10) + ' XP</span></span>' +
        '<span class="hstreak' + (st >= 3 ? ' hot' : '') + '">' + (st > 0 ? icon('flame') + st : '') + '</span>' +
        '</button>';
    }

    function viewOnboard() {
      var chips = Object.keys(AREAS).filter(function (a) { return a !== 'other'; }).map(function (a) {
        return '<button class="chip" data-act="obarea" data-a="' + a + '" aria-pressed="' + (!!ob.areas[a]) + '">' + AREAS[a] + '</button>';
      }).join('');
      var lv = [[3, 'Gentle', '3 habits a day'], [5, 'Steady', '5 habits a day'], [8, 'Ambitious', '8 habits a day']].map(function (o) {
        return '<button class="lvlcard' + (ob.count === o[0] ? ' on' : '') + '" data-act="obcount" data-n="' + o[0] + '"><b>' + o[1] + '</b><span>' + o[2] + '</span></button>';
      }).join('');
      var any = Object.keys(ob.areas).some(function (a) { return ob.areas[a]; });
      return '<section class="onboard">' +
        '<div class="brandbig"><img class="brand-mark-img" src="brand/ritual-mark.svg" alt="Ritual logo"><h1>Ritual</h1>' +
        '<p class="lede">Small habits, kept daily. Choose what matters, check in each day, and watch your follow-through build.</p></div>' +
        '<div><p class="eyebrow">What do you want to work on</p><div class="chips" style="margin-top:12px">' + chips + '</div></div>' +
        '<div><p class="eyebrow">How much per day</p><div class="stack" style="margin-top:12px">' + lv + '</div></div>' +
        '<button class="btn block" aria-label="Start Ritual day one" data-act="begin"' + (any ? '' : ' disabled') + '>' + icon('arrowr') + ' Start day one</button>' +
        '<p class="small muted" style="text-align:center">Your data stays on this device.</p>' +
        '</section>';
    }

    function viewToday() {
      var t = todayKey(), D = derive();
      var hs = activeHabits().filter(function (h) { return scheduledOn(h, t); });
      var done = S.log[t] || {};
      var c = hs.filter(function (h) { return done[h.id]; }).length;
      var pct = hs.length ? Math.round(c / hs.length * 100) : 0;
      var restDay = !!S.rest[t];
      var C = 2 * Math.PI * 66;
      var off = (C * (1 - pct / 100)).toFixed(1);
      var h = '';
      h += '<div class="greet"><div><p class="eyebrow">' + esc(greetWord()) + '</p><h1 class="h-date">' + esc(fmtLong(t)) + '</h1></div>' +
        '<div class="streakpill">' + icon('flame') + '<b>' + D.streak + '</b><span>day<br>streak</span></div></div>';

      h += '<div class="card herocard">' +
        '<div class="ringwrap"><svg class="ring" viewBox="0 0 160 160"><circle class="ring-bg" cx="80" cy="80" r="66"/>' +
        '<circle class="ring-fg" cx="80" cy="80" r="66" style="stroke-dasharray:' + C.toFixed(1) + ';stroke-dashoffset:' + off + '"/></svg>' +
        '<div class="ringmid"><b>' + pct + '%</b><span>' + c + ' of ' + hs.length + ' today</span></div></div>' +
        '<div class="statstrip">' +
        '<div class="stat"><b>' + D.streak + '</b><span>Day streak</span></div>' +
        '<div class="stat"><b>' + D.best + '</b><span>Best streak</span></div>' +
        '<div class="stat"><b>' + D.consistency + '%</b><span>Consistency</span></div>' +
        '</div></div>';

      h += '<div class="levelrow"><span class="lvlname">Level ' + D.level + ' · ' + D.title + '</span><span class="mono muted small">' + D.xp + ' XP</span></div>' +
        '<div class="bar steel"><span style="width:' + D.pct + '%"></span></div>';

      if (restDay) h += '<div class="banner rest">' + icon('moon') + '<span>Rest day. Your streak is safe.</span></div>';
      else if (hs.length && c === hs.length) h += '<div class="banner good">' + icon('check') + '<span><b>Clean day.</b> All ' + hs.length + ' done, +25 XP.</span></div>';

      if (!hs.length) {
        h += '<div style="margin-top:22px" class="empty">Nothing scheduled today.<br>Add a habit to get started.</div>';
      } else {
        ['morning', 'afternoon', 'evening', 'anytime'].forEach(function (sl) {
          var g = hs.filter(function (x) { return x.slot === sl; });
          if (!g.length) return;
          h += '<div class="grouphead">' + SLOTS[sl] + '</div><div class="list">' + g.map(function (x) { return hrow(x, !!done[x.id]); }).join('') + '</div>';
        });
      }

      h += '<div class="od-row" style="margin-top:20px">' +
        '<button class="btn ghost od-fill" data-act="rest" style="min-height:46px">' + (restDay ? 'Resume today' : 'Take a rest day') + '</button>' +
        '<button class="btn od-fill" data-act="add" style="min-height:46px">' + icon('plus') + ' Add habit</button></div>';
      return h;
    }

    function viewStats() {
      var D = derive();
      var days = statsRange === 0 ? trackedDays() : lastDays(statsRange);
      var a = agg(days);
      var rows = activeHabits().map(function (h) { var ad = adherence(h, days); return { h: h, a: ad, st: habitStreak(h) }; })
        .filter(function (r) { return r.a.s > 0; }).sort(function (x, y) { return (y.a.pct || 0) - (x.a.pct || 0); });

      var h = '<div class="section-head"><h2>Insights</h2></div>';
      h += '<div class="seg" role="group" aria-label="Range">' +
        [[7, '7 days'], [30, '30 days'], [0, 'All time']].map(function (o) {
          return '<button data-act="range" data-v="' + o[0] + '" aria-pressed="' + (statsRange === o[0]) + '">' + o[1] + '</button>';
        }).join('') + '</div>';

      h += '<div class="card" style="margin-top:14px"><div class="statstrip">' +
        '<div class="stat"><b>' + a.overall + '%</b><span>Completion</span></div>' +
        '<div class="stat"><b>' + a.consistency + '%</b><span>Consistency</span></div>' +
        '<div class="stat"><b>' + D.streak + '</b><span>Streak</span></div>' +
        '</div></div>';

      if (rows.length) {
        var best = rows[0], worst = rows[rows.length - 1];
        h += '<div class="callouts">';
        h += '<div class="callout good">' + icon('bolt') + '<div class="ctxt"><b>Strongest: ' + esc(best.h.title) + '</b><span>' + best.a.pct + '% follow-through across ' + best.a.s + ' scheduled days.</span></div></div>';
        if (rows.length > 1) h += '<div class="callout bad">' + icon('target') + '<div class="ctxt"><b>Needs work: ' + esc(worst.h.title) + '</b><span>' + worst.a.pct + '% follow-through. Try a smaller version of it.</span></div></div>';
        var avg = Math.round(rows.reduce(function (s, r) { return s + (r.a.pct || 0); }, 0) / rows.length);
        h += '<div class="callout warn">' + icon('chart') + '<div class="ctxt"><b>Average habit: ' + avg + '%</b><span>' + D.completions + ' total check-ins since you started.</span></div></div>';
        h += '</div>';
      }

      h += '<div class="eyebrow-row"><span class="eyebrow">Follow-through by habit</span></div>';
      if (!rows.length) h += '<div class="empty">No scheduled days in this range yet. Check a habit off and the numbers appear.</div>';
      else h += '<div class="card">' + rows.map(function (r) {
        var col = (r.a.pct || 0) >= 70 ? 'var(--accent)' : (r.a.pct || 0) >= 40 ? 'var(--amber)' : 'var(--coral)';
        return '<div class="arow"><div class="arow-top"><span class="aname od-fill">' + esc(r.h.title) + '</span><span class="apct">' + (r.a.pct == null ? '—' : r.a.pct + '%') + '</span></div>' +
          '<div class="abar"><span style="width:' + (r.a.pct || 0) + '%;background:' + col + '"></span></div>' +
          '<span class="asub">' + r.a.d + ' of ' + r.a.s + ' kept · current streak ' + r.st + '</span></div>';
      }).join('') + '</div>';

      h += '<div class="eyebrow-row"><span class="eyebrow">Last 14 days</span></div>' + trendBars();
      h += '<div class="eyebrow-row"><span class="eyebrow">Last 12 weeks</span></div>' + heatmap();
      h += '<div class="legend"><span class="l-well"><i></i>Clean / kept</span><span class="l-part"><i></i>Partial</span><span class="l-rest"><i></i>Rest</span><span class="l-miss"><i></i>Missed</span></div>';
      return h;
    }

    function trendBars() {
      var days = lastDays(14); if (!days.length) return '<div class="empty">Not enough history yet.</div>';
      return '<div class="bars">' + days.map(function (dk) {
        var st = dayStats(dk), hgt = Math.max(5, Math.round(st.ratio * 100));
        var col = st.rest ? 'var(--sky)' : st.ratio >= 0.6 ? 'var(--accent)' : st.ratio > 0 ? 'var(--amber)' : 'var(--surface2)';
        return '<div class="bcol"><div class="btrack"><span style="height:' + hgt + '%;background:' + col + '"></span></div><span class="blab">' + parseD(dk).getDate() + '</span></div>';
      }).join('') + '</div>';
    }

    function heatmap() {
      var t = todayKey();
      var lastSunday = addDays(t, -parseD(t).getDay());
      var start = addDays(lastSunday, -11 * 7);
      var cells = '';
      for (var i = 0; i < 84; i++) {
        var dk = addDays(start, i), cls = 'hcell', future = dk > t || (S.start && dk < S.start);
        if (future) cls += ' future';
        else {
          var st = dayStats(dk);
          if (st.rest) cls += ' rest';
          else if (st.n === 0) cls += '';
          else if (st.ratio >= 0.6) cls += ' well';
          else if (st.c > 0) cls += ' part';
          else cls += ' miss';
          if (dk === t) cls += ' today';
        }
        cells += '<span class="' + cls + '" title="' + dk + '"></span>';
      }
      return '<div class="heatgrid">' + cells + '</div>';
    }

    function viewHabits() {
      var active = activeHabits();
      var archived = S.habits.filter(function (h) { return h.archived; });
      var h = '<div class="section-head"><h2>Habits</h2><button class="iconbtn accent" data-act="add" aria-label="New habit">' + icon('plus') + '</button></div>';
      h += '<p class="small muted" style="margin-bottom:14px">' + active.length + ' active · tap edit to change name, days or time.</p>';
      if (!active.length) h += '<div class="empty">No habits yet.<br>Tap + to add your first one.</div>';
      active.forEach(function (x, i) {
        var color = AREA_COLOR[x.area] || 'var(--accent)';
        var confirming = pendingDel === x.id;
        h += '<div class="hcard"><span class="hdrag" style="background:' + color + '"></span>' +
          '<div class="hinfo"><span class="htitle">' + esc(x.title) + '</span><span class="hmeta">' + esc(AREAS[x.area] || 'Custom') + ' · ' + esc(SLOTS[x.slot] || 'Anytime') + ' · ' + esc(schedLabel(x)) + '</span></div>' +
          '<div class="hbtns">' +
          '<button class="ico" data-act="up" data-id="' + x.id + '" aria-label="Move up"' + (i === 0 ? ' disabled style="opacity:.4"' : '') + '>' + icon('up') + '</button>' +
          '<button class="ico" data-act="down" data-id="' + x.id + '" aria-label="Move down"' + (i === active.length - 1 ? ' disabled style="opacity:.4"' : '') + '>' + icon('down') + '</button>' +
          '<button class="ico" data-act="edit" data-id="' + x.id + '" aria-label="Edit">' + icon('edit') + '</button>' +
          '<button class="ico danger" data-act="del" data-id="' + x.id + '" aria-label="Delete">' + (confirming ? icon('check') : icon('trash')) + '</button>' +
          '</div></div>';
      });
      if (archived.length) {
        h += '<div class="eyebrow-row"><span class="eyebrow">Archived</span></div>';
        archived.forEach(function (x) {
          h += '<div class="hcard"><span class="hdrag" style="background:var(--line)"></span><div class="hinfo"><span class="htitle muted">' + esc(x.title) + '</span></div>' +
            '<div class="hbtns"><button class="ico" data-act="archive" data-id="' + x.id + '" aria-label="Restore">' + icon('reset') + '</button></div></div>';
        });
      }
      return h;
    }

    function viewJournal() {
      var chips = MOODS.map(function (m) { return '<button class="chip" data-act="mood" data-m="' + m + '" aria-pressed="' + (jd.mood === m) + '">' + m + '</button>'; }).join('');
      var list = S.journal.slice().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); }).map(function (e) {
        var confirming = pendingDel === e.id;
        return '<article class="entry"><div class="ehead"><span class="eyebrow">' + esc(fmtMed(e.date)) + (e.mood ? ' · ' + esc(e.mood) : '') + '</span>' +
          '<button class="chip" data-act="jdel" data-id="' + e.id + '" style="padding:6px 12px">' + (confirming ? 'Confirm' : 'Delete') + '</button></div><p>' + esc(e.text) + '</p></article>';
      }).join('');
      return '<div class="section-head"><h2>Journal</h2></div>' +
        '<div class="card"><p class="eyebrow">Today\'s prompt</p><p class="prompt">' + esc(jd.prompt) + '</p>' +
        '<div class="chips" style="margin-bottom:14px">' + chips + '</div>' +
        '<textarea id="j-text" maxlength="4000" aria-label="Journal entry" placeholder="Write as much or as little as you like.">' + esc(jd.text) + '</textarea>' +
        '<button class="btn block" data-act="jsave" style="margin-top:12px">Save entry</button></div>' +
        '<div class="entries">' + (list || '<div class="empty" style="margin-top:20px">No entries yet. Reflections show up here.</div>') + '</div>';
    }

    function viewYou() {
      var D = derive();
      var achs = ACHS.map(function (x) { var on = x[2](D); return '<div class="ach ' + (on ? 'on' : 'off') + '"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }).join('');
      var unlocked = ACHS.filter(function (x) { return x[2](D); }).length;
      var themes = [['dark', 'Dark', 'moon'], ['light', 'Light', 'sun'], ['system', 'System', 'reset']];
      return '<div class="section-head"><h2>You</h2></div>' +
        '<div class="card"><div class="levelcard"><p class="eyebrow">Level ' + D.level + '</p><div class="levelname">' + D.title + '</div>' +
        '<div class="bar steel"><span style="width:' + D.pct + '%"></span></div>' +
        '<p class="mono muted small">' + D.xp + ' XP · ' + (D.next - D.xp) + ' to level ' + (D.level + 1) + '</p></div></div>' +

        '<div class="block"><h3>Achievements <span class="eyebrow" style="margin-left:6px">' + unlocked + ' / ' + ACHS.length + '</span></h3><div class="achs">' + achs + '</div></div>' +

        '<div class="block"><h3>Appearance</h3><div class="seg" role="group" aria-label="Theme">' +
        themes.map(function (t) { return '<button data-act="theme" data-v="' + t[0] + '" aria-pressed="' + (S.theme === t[0]) + '">' + t[1] + '</button>'; }).join('') +
        '</div></div>' +

        '<div class="block"><h3>' + (typeof window.Capacitor !== 'undefined' ? 'Ritual is installed' : 'Install as app') + '</h3><p class="about" style="margin-bottom:12px">' +
        (typeof window.Capacitor !== 'undefined' ? 'You are running the full Android app shell. Your Ritual data stays on this device.' : 'Add Ritual to your home screen for a standalone, offline experience. No account or subscription is required.') +
        '</p>' +
        (typeof window.Capacitor !== 'undefined' ? '<div class="banner good">' + icon('check') + '<span><b>Native app mode.</b> Android supplies the real status and navigation bars.</span></div>' :
          '<button class="btn block" data-act="install">' + icon('download') + ' Install Ritual</button><p class="small muted" id="install-note" style="margin-top:10px">You can also use your browser menu → Add to Home screen.</p>') +
        '</div>' +

        '<div class="block"><h3>Your data</h3><p class="about" style="margin-bottom:12px">Stored on this device only. Export a backup now and then so nothing is lost.</p>' +
        '<div class="od-row"><button class="btn ghost od-fill" data-act="export">' + icon('download') + ' Backup</button>' +
        '<button class="btn ghost od-fill" data-act="import">' + icon('upload') + ' Restore</button></div>' +
        '<button class="btn ghost block" data-act="reset" style="margin-top:10px;color:var(--coral);border-color:var(--coral-soft)">' + icon('trash') + ' Start over</button></div>' +

        '<div class="block"><h3>About</h3><p class="about">Ritual is a private daily habit tracker: customizable habits, local storage, streaks and levels, and honest follow-through analytics. No account, no network. Version 1.2.</p></div>';
    }

    function greetWord() {
      var hr = new Date().getHours();
      return hr < 5 ? 'Late night' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
    }

    /* ============================== render ============================== */
    function render() {
      var tabsEl = $('#tabbar');
      if (!S.started) {
        tabsEl.hidden = true;
        $('#view').innerHTML = viewOnboard();
        return;
      }
      tabsEl.hidden = false;
      Array.prototype.forEach.call(tabsEl.querySelectorAll('button'), function (b) {
        b.setAttribute('aria-selected', b.getAttribute('data-tab') === tab ? 'true' : 'false');
      });
      var fn = { today: viewToday, stats: viewStats, habits: viewHabits, journal: viewJournal, you: viewYou }[tab] || viewToday;
      $('#view').innerHTML = fn();
    }

    /* ============================== actions ============================== */
    function toggleTask(id) {
      var t = todayKey(), done = S.log[t] || (S.log[t] = {}), was = derive();
      if (done[id]) delete done[id]; else done[id] = true;
      save();
      var after = derive();
      render();
      if (after.level > was.level) toast('Level ' + after.level + ': ' + after.title);
      else if (after.streak > was.streak) toast('Streak: ' + after.streak + ' days');
    }
    function begin() {
      var areas = Object.keys(AREAS).filter(function (a) { return ob.areas[a]; });
      if (!areas.length) return;
      S = blank(); S.started = true; S.start = todayKey(); S.theme = S.theme || 'dark';
      var lists = areas.map(function (a) {
        return TEMPLATES[a].slice().sort(function (x, y) { return x.d - y.d; }).map(function (x) { return { a: a, t: x }; });
      });
      var out = [], i = 0;
      while (out.length < ob.count && lists.some(function (l) { return l.length > i; })) {
        lists.forEach(function (l) { if (out.length < ob.count && l[i]) out.push(l[i]); });
        i++;
      }
      S.habits = out.map(function (o, idx) {
        return { id: uid(), title: o.t.t, area: o.a, slot: o.t.s, days: DAILY.slice(), xp: XP_BY_DIFF[o.t.d], archived: false, createdAt: S.start, order: idx };
      });
      save(); tab = 'today'; render();
      toast(S.habits.length + ' habits added. Day one starts now.');
    }
    function addStarter(area) {
      var have = {}; S.habits.forEach(function (h) { have[h.title] = 1; });
      var avail = (TEMPLATES[area] || []).filter(function (x) { return !have[x.t]; }).slice(0, 2);
      if (!avail.length) { toast('Every ' + AREAS[area] + ' habit is already on your list'); return; }
      avail.forEach(function (x, i) {
        S.habits.push({ id: uid(), title: x.t, area: area, slot: x.s, days: DAILY.slice(), xp: XP_BY_DIFF[x.d], archived: false, createdAt: todayKey(), order: S.habits.length + i });
      });
      save(); render(); toast('Added ' + avail.length + ' ' + AREAS[area] + ' habit' + (avail.length > 1 ? 's' : ''));
    }
    function saveHabit() {
      var title = ($('#h-title') ? $('#h-title').value : '').trim();
      if (!title) { toast('Give the habit a name first'); return; }
      if (!sheetDays.length) { toast('Pick at least one day'); return; }
      var area = $('#h-area') ? $('#h-area').value : 'other';
      var slot = $('#h-slot') ? $('#h-slot').value : 'anytime';
      var diff = $('#h-diff') ? +$('#h-diff').value : 2;
      if (editId) {
        var h = habitById(editId);
        if (h) { h.title = title; h.area = area; h.slot = slot; h.days = sheetDays.slice(); h.xp = XP_BY_DIFF[diff]; }
        toast('Habit updated');
      } else {
        S.habits.push({ id: uid(), title: title, area: area, slot: slot, days: sheetDays.slice(), xp: XP_BY_DIFF[diff], archived: false, createdAt: todayKey(), order: S.habits.length });
        toast('Habit added');
      }
      save(); closeSheet(); render();
    }
    function moveHabit(id, dir) {
      var active = activeHabits();
      var i = -1; for (var k = 0; k < active.length; k++) if (active[k].id === id) { i = k; break; }
      var j = i + dir;
      if (i < 0 || j < 0 || j >= active.length) return;
      var a = active[i], b = active[j];
      var ai = S.habits.indexOf(a), bi = S.habits.indexOf(b);
      S.habits[ai] = b; S.habits[bi] = a;
      save(); render();
    }
    function deleteHabit(id) {
      S.habits = S.habits.filter(function (h) { return h.id !== id; });
      Object.keys(S.log).forEach(function (dk) { if (S.log[dk]) delete S.log[dk][id]; });
      pendingDel = null; save(); render(); toast('Habit deleted');
    }
    function saveJournal() {
      var txt = ($('#j-text') ? $('#j-text').value : jd.text).trim();
      if (!txt) { toast('Write something first'); return; }
      S.journal.unshift({ id: uid(), date: todayKey(), ts: Date.now(), mood: jd.mood, text: txt });
      jd.text = ''; jd.mood = ''; jd.prompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
      save(); render(); toast('Entry saved');
    }
    function applyTheme(v) {
      S.theme = v; save();
      var resolved = v === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : v;
      document.documentElement.setAttribute('data-theme', resolved);
      document.querySelector('meta[name=theme-color]').setAttribute('content', resolved === 'light' ? '#F3F5F7' : '#0B0E13');
      render();
    }
    function doExport() {
      var data = JSON.stringify(S, null, 2);
      try {
        var blob = new Blob([data], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a'); a.href = url; a.download = 'ritual-backup-' + todayKey() + '.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      } catch (e) {}
      exportSheet(data);
    }
    function doImport() {
      var val = $('#imp-text') ? $('#imp-text').value : '';
      try {
        var p = JSON.parse(val);
        if (!p || p.v !== 1 || !Array.isArray(p.habits)) throw new Error('shape');
        S = Object.assign(blank(), p);
        if (!Array.isArray(S.habits)) S.habits = [];
        if (typeof S.log !== 'object' || !S.log) S.log = {};
        if (typeof S.rest !== 'object' || !S.rest) S.rest = {};
        if (!Array.isArray(S.journal)) S.journal = [];
        save(); closeSheet(); tab = 'today'; render(); toast('Backup restored');
      } catch (e) { toast('That is not a Ritual backup'); }
    }
    function doReset() {
      S = blank(); save(); closeSheet(); tab = 'today';
      ob = { areas: { body: true, mind: true, calm: true }, count: 5 };
      render(); toast('Everything erased');
    }

    /* ============================== events ============================== */
    document.addEventListener('click', function (ev) {
      var tb = ev.target.closest('#tabbar button');
      if (tb) { tab = tb.getAttribute('data-tab'); $('#view').scrollTop = 0; pendingDel = null; render(); return; }
      var sc = ev.target.closest('#scrim');
      if (sc) { closeSheet(); return; }
      var el = ev.target.closest('[data-act]'); if (!el) return;
      var act = el.getAttribute('data-act');
      switch (act) {
        case 'obarea': var a = el.getAttribute('data-a'); ob.areas[a] = !ob.areas[a]; render(); break;
        case 'obcount': ob.count = +el.getAttribute('data-n'); render(); break;
        case 'begin': begin(); break;
        case 'toggle': toggleTask(el.getAttribute('data-id')); break;
        case 'rest': var rt = todayKey(); if (S.rest[rt]) delete S.rest[rt]; else S.rest[rt] = true; save(); render(); break;
        case 'add': habitSheet(null); break;
        case 'edit': habitSheet(el.getAttribute('data-id')); break;
        case 'del':
          var did = el.getAttribute('data-id');
          if (pendingDel === did) { deleteHabit(did); } else { pendingDel = did; render(); }
          break;
        case 'archive': var ah = habitById(el.getAttribute('data-id')); if (ah) { ah.archived = !ah.archived; save(); render(); } break;
        case 'up': moveHabit(el.getAttribute('data-id'), -1); break;
        case 'down': moveHabit(el.getAttribute('data-id'), 1); break;
        case 'save-habit': saveHabit(); break;
        case 'sheet-close': closeSheet(); break;
        case 'sday':
          var d = +el.getAttribute('data-d'), si = sheetDays.indexOf(d);
          if (si >= 0) sheetDays.splice(si, 1); else sheetDays.push(d);
          el.setAttribute('aria-pressed', si < 0 ? 'true' : 'false');
          break;
        case 'sday-all':
          sheetDays = DAILY.slice();
          Array.prototype.forEach.call(document.querySelectorAll('.daybtn'), function (b) { b.setAttribute('aria-pressed', 'true'); });
          break;
        case 'range': statsRange = +el.getAttribute('data-v'); render(); break;
        case 'mood': var m = el.getAttribute('data-m'); jd.mood = jd.mood === m ? '' : m; var ta = $('#j-text'); if (ta) jd.text = ta.value; render(); break;
        case 'jsave': saveJournal(); break;
        case 'jdel':
          var jid = el.getAttribute('data-id');
          if (pendingDel === jid) { S.journal = S.journal.filter(function (x) { return x.id !== jid; }); pendingDel = null; save(); render(); toast('Entry deleted'); }
          else { pendingDel = jid; render(); }
          break;
        case 'theme': applyTheme(el.getAttribute('data-v')); break;
        case 'export': doExport(); break;
        case 'copy-backup':
          var tx = $('#exp-text');
          if (tx) { tx.select(); try { navigator.clipboard.writeText(tx.value); } catch (e) { try { document.execCommand('copy'); } catch (e2) {} } toast('Copied to clipboard'); }
          break;
        case 'import': importSheet(); break;
        case 'import-yes': doImport(); break;
        case 'reset': resetSheet(); break;
        case 'reset-yes': doReset(); break;
        case 'install':
          if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.then(function () { deferredInstall = null; toast('Installing…'); }); }
          else { toast('Use your browser menu → Add to Home screen'); }
          break;
      }
    });
    document.addEventListener('input', function (ev) { if (ev.target.id === 'j-text') jd.text = ev.target.value; });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); } });

    /* ============================== boot ============================== */
    var TAB_ICONS = { today: 'target', stats: 'chart', habits: 'list', journal: 'book', you: 'user' };
    (function setupTabs() {
      var tb = $('#tabbar');
      Array.prototype.forEach.call(tb.querySelectorAll('button'), function (b) {
        var k = b.getAttribute('data-tab');
        b.innerHTML = icon(TAB_ICONS[k]) + '<span>' + b.textContent + '</span>';
      });
    })();

    /* installable PWA: capture the install prompt + register the service worker */
    var deferredInstall = null;
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; });
    window.addEventListener('appinstalled', function () { deferredInstall = null; toast('Ritual added to your home screen'); });
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }

    render();
    setInterval(function () {
      var d = todayKey();
      if (d !== lastDay) { lastDay = d; jd.prompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)]; if (S.started) render(); }
    }, 60000);
  })();
  </script>
  <script src="ritual-v2.js"></script>
</body>
