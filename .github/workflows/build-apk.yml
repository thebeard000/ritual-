name: Build Ritual Web + Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ritual-build
  cancel-in-progress: false

jobs:
  web:
    name: Prepare + verify web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify source
        run: npm run verify:web
      - name: Prepare deploy bundle
        run: npm run prepare:web
      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: ritual-web
          path: www
          retention-days: 14

  pages:
    name: Deploy PWA to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ritual-web
          path: www
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Build Android APK
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web/native dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Capacitor web bundle
        run: npm run prepare:web
      - name: Add Android platform
        run: npx cap add android
      - name: Generate Android launcher and splash assets
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#090D0B' --iconBackgroundColorDark '#090D0B' --splashBackgroundColor '#090D0B' --splashBackgroundColorDark '#090D0B'
      - name: Sync Capacitor project
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ritual-debug.apk
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: ritual-android-apk
          path: Ritual-debug.apk
          if-no-files-found: error
          retention-days: 30
