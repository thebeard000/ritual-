name: Build Android APK (Bubblewrap)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apk-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    needs: pages
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: android
      BUBBLEWRAP_KEY_PASSWORD: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Generate a signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Ritual, O=Ritual, C=US"

      - name: Point the TWA manifest at this repo's Pages URL
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s#__OWNER__#${OWNER}#g; s#__REPO__#${REPO}#g" twa-manifest.json
          cat twa-manifest.json

      - name: Wait for the site to go live
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/manifest.webmanifest"
          for i in $(seq 1 30); do
            if curl -fsS "$URL" -o /dev/null; then
              echo "live: $URL"
              exit 0
            fi
            echo "waiting for $URL ($i/30)"
            sleep 10
          done
          echo "site not reachable yet; continuing anyway"

      - name: Build the APK with Bubblewrap
        run: bubblewrap build --skipPwaValidation

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ritual-apk
          path: |
            app-release-signed.apk
            app-release-unsigned.apk
          if-no-files-found: error
