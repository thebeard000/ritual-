name: Build Ritual Web + Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ritual-build
  cancel-in-progress: false

jobs:
  pages:
    name: Deploy PWA to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Build Android APK
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install web/native dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Capacitor web bundle
        run: npm run prepare:web
      - name: Add Android platform
        run: npx cap add android
      - name: Generate Android launcher and splash assets
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#090D0B' --iconBackgroundColorDark '#090D0B' --splashBackgroundColor '#090D0B' --splashBackgroundColorDark '#090D0B'
      - name: Sync Capacitor project
        run: npx cap sync android
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: ritual-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
